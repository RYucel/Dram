    <path d="M -48 16 Q -56 50 -26 70 Q 0 80 26 70 Q 56 50 48 16 Q 24 24 0 24 Q -24 24 -48 16 Z" 
          fill="url(#mLiquidGrad)"/>
    <path d="M -16 84 L -18 102 L -42 110 L 42 110 L 18 102 L 16 84 Z" fill="url(#mGoldGrad)"/>
    <ellipse cx="0" cy="110" rx="44" ry="7" fill="url(#mGoldGrad)"/>
    <ellipse cx="0" cy="-68" rx="34" ry="6" fill="none" stroke="url(#mGoldGrad)" stroke-width="6"/>
    <path d="M -26 -50 Q -36 0 -44 32" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <text x="256" y="375" font-family="'Montserrat', sans-serif" font-size="22" font-weight="800" fill="url(#mGoldGrad)" text-anchor="middle" letter-spacing="3">
